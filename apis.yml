name: Shift5
description: 'Shift5 is an operational technology (OT) cyber and observability company
  that instruments the onboard serial data buses of planes, trains, and military weapons
  systems to deliver real-time intrusion detection, predictive maintenance, and compliance
  intelligence for defense and transportation fleets. Founded by former US Army Cyber
  Command engineers, it collects and analyzes data directly from vehicle bus networks
  (MIL-STD-1553, ARINC 429, CAN) to give operators actionable insight into the health
  and security of their platforms. Backed by Insight Partners. This profile was added
  to the API Evangelist network as a portfolio-lead stub; enrichment confirms Shift5
  publishes no public API or developer program.'
